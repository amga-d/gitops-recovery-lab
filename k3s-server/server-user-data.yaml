#cloud-config

hostname: k3s-server
users:
  - name: server
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    ssh_authorized_keys:
    - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAID9Uq41XnnXjOaq3uPH3J7RRAb2LjLE64UIG4JaVf2z5 k3s-server-agent
package_update: true
packages:
  - qemu-guest-agent
  - curl
  - git


runcmd:
  - systemctl enable --now qemu-guest-agent
  - curl -sfL https://get.k3s.io | K3S_TOKEN=my-lab-secret sh -s - server --cluster-init --flannel-backend=none --disable-network-policy --write-kubeconfig-mode 644 --cluster-cidr=172.20.0.0/16
  - until /usr/local/bin/kubectl get nodes; do sleep 5; done
  - curl -sfL -o /tmp/calico.yaml https://raw.githubusercontent.com/projectcalico/calico/v3.33.0/manifests/calico.yaml
  - |
    sed -i -e 's|# - name: CALICO_IPV4POOL_CIDR|- name: CALICO_IPV4POOL_CIDR|' -e 's|#   value: "192.168.0.0/16"|  value: "172.20.0.0/16"|' /tmp/calico.yaml
  - /usr/local/bin/kubectl apply -f /tmp/calico.yaml
