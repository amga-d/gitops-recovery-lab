apiVersion: chaos-mesh.org/v1alpha1
kind: Schedule
metadata:
  name: stable-crash-${TRIAL_ID}
  namespace: ${NAMESPACE}
spec:
  schedule: "@every 10s"
  type: PodChaos
  historyLimit: 3
  concurrencyPolicy: Allow
  podChaos:
    action: container-kill
    mode: all
    containerNames: [app]
    selector:
      pods:
        ${NAMESPACE}: ["${TARGET_POD}"]
