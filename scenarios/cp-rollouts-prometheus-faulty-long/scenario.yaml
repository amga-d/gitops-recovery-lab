name: cp-rollouts-prometheus-faulty-long
description: >
  A faulty release (30% HTTP 500) is analysed while the Argo Rollouts
  controller cannot reach Prometheus, so its metric cannot show the fault.
  Long variant: the 300 s partition outlasts the analysis's
  consecutive-error limit, so detection can come through the error path.
category: network
surface: control-path
expected_recovery: rollouts    # if at all, through the analysis error path
applies_to:
  strategies: [canary]
  sync_policies: [auto]
trigger:
  phase: during-rollout
  at: release-live
target:
  selector: control-path
inject:
  kind: chaos-mesh
  manifest: networkchaos.yaml
  stop_after: 300s
  patch:                       # the release under test is faulty as well
    env:
      ERROR_RATE: "0.3"
confirm:
  kind: chaos-injected
  within: 30s
cleanup: {kind: chaos-mesh-delete}
timeout: 600s
