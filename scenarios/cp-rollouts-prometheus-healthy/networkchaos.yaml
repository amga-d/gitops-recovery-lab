apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: rollouts-prometheus-${TRIAL_ID}
  namespace: ${NAMESPACE}
spec:
  action: partition
  mode: all
  selector:
    namespaces: [argo-rollouts]
    labelSelectors:
      app.kubernetes.io/name: argo-rollouts
  # Both sides: the controller reaches Prometheus through its ClusterIP, which
  # is translated outside the pod, so only Prometheus's side sees pod IPs.
  direction: both
  target:
    mode: all
    selector:
      namespaces: [monitoring]
      labelSelectors:
        app.kubernetes.io/name: prometheus
  duration: 15m
