name: crashloop
description: >
  The release under test is driven into CrashLoopBackOff: Chaos Mesh kills its
  app container every 10 s, so the kubelet restarts it with growing back-off.
category: pod
surface: release
expected_recovery: rollouts
applies_to:
  strategies: [canary, bluegreen, rolling]
  sync_policies: [auto, manual]
trigger:
  phase: during-rollout
  at: release-live       # canary: first step serving; blue-green: preview ready; rolling: first new pod ready
target:
  selector: release-under-test
  node: any
inject:
  kind: chaos-mesh
  manifest: schedule.yaml
confirm:
  kind: pod-restarts
  within: 45s
cleanup: {kind: chaos-mesh-delete}
timeout: 600s
