name: bad-image
description: The release under test names an image that cannot be pulled.
category: release
surface: release
expected_recovery: rollouts   # by the progress deadline; the pods never serve
applies_to:
  strategies: [canary, bluegreen, rolling]
  sync_policies: [auto, manual]
trigger:
  phase: during-rollout
  at: applied
target:
  selector: release-under-test
  node: any
inject:
  kind: git-commit
  patch:
    image: registry.invalid/mttr-app:missing
confirm:
  kind: pod-waiting
  reasons: [ErrImagePull, ImagePullBackOff]
  within: 60s
cleanup: {kind: none}
timeout: 600s
