global:
  # Every component inherits these: keep the GitOps controller on the tainted
  # control-plane server, out of the application's failure domain.
  nodeSelector:
    kubernetes.io/os: linux
    node-role.kubernetes.io/control-plane: "true"
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists

configs:
  params:
    server.insecure: true            # serve plain HTTP; fine for a lab, avoids TLS hassle
  cm:
    timeout.reconciliation: 180s     # polling interval; keep it fixed across runs
    # No random spread on top of the interval, so the poll fallback is the
    # same for every trial (Argo CD otherwise adds up to 60s of jitter).
    timeout.reconciliation.jitter: 0s

server:
  service:
    type: NodePort
    nodePortHttp: 30080              # UI and API at http://<node-ip>:30080
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

# Metrics for Prometheus. The application controller's include argocd_app_info
# (sync and health status per Application).
controller:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
repoServer:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
applicationSet:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

dex:
  enabled: false                     # no SSO needed
notifications:
  enabled: false                     # turn this on later if you want alerts or timestamps
