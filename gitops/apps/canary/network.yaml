apiVersion: v1
kind: Service
metadata:
  name: mttr-app-stable
spec:
  selector:
    app.kubernetes.io/name: mttr-app
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: mttr-app-canary
spec:
  selector:
    app.kubernetes.io/name: mttr-app
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Argo Rollouts sets these weights during a canary; Argo CD ignores them.
apiVersion: traefik.io/v1alpha1
kind: TraefikService
metadata:
  name: mttr-app
spec:
  weighted:
    services:
      - name: mttr-app-stable
        port: 80
        weight: 100
      - name: mttr-app-canary
        port: 80
        weight: 0
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: canary
spec:
  entryPoints: [web]
  routes:
    - match: Host(`canary.mttr.lab`)
      kind: Rule
      services:
        - name: mttr-app
          kind: TraefikService
---
# Scrape every app pod; the release label lets the analysis and the runner
# separate the release under test from the stable one.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: mttr-app
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: mttr-app
  podTargetLabels:
    - rollouts-pod-template-hash
  podMetricsEndpoints:
    - port: http
      path: /metrics
