apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: mttr-app
spec:
  replicas: 4
  revisionHistoryLimit: 2
  # A release whose pods never become available (bad image, crash on start)
  # is aborted after this long without progress.
  progressDeadlineSeconds: 90
  progressDeadlineAbort: true
  selector:
    matchLabels:
      app.kubernetes.io/name: mttr-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mttr-app
    spec:
      terminationGracePeriodSeconds: 15
      # Spread each release evenly over the two agents; the tainted server is
      # not a candidate, so it must not count as an empty domain either.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          matchLabelKeys:
            - rollouts-pod-template-hash
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: mttr-app
      containers:
        - name: app
          image: mttr.local/mttr-app:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: RELEASE
              value: v1
            - name: BACKEND_URL
              value: http://mttr-backend.mttr-backend.svc.cluster.local/
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 2
          resources:
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              memory: 64Mi
  strategy:
    # A rolling update under Argo Rollouts: a canary with no traffic router,
    # so the share of traffic follows the share of new pods (1 of 4 per step).
    canary:
      maxSurge: 1
      maxUnavailable: 0
      steps:
        - setWeight: 25
        - pause: {duration: 60s}
        - setWeight: 50
        - pause: {duration: 60s}
        - setWeight: 75
        - pause: {duration: 60s}
      analysis:
        templates:
          - templateName: release-health
            clusterScope: true
        startingStep: 1
        args:
          - name: namespace
            value: mttr-rolling
          - name: hash
            valueFrom:
              podTemplateHashValue: Latest
