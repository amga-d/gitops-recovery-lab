apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: mttr-app
spec:
  replicas: 4
  revisionHistoryLimit: 2
  # A release whose pods never become available (bad image, crash on start)
  # is aborted after this long without progress.
  progressDeadlineSeconds: 90
  progressDeadlineAbort: true
  selector:
    matchLabels:
      app.kubernetes.io/name: mttr-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mttr-app
    spec:
      terminationGracePeriodSeconds: 15
      # Spread each release evenly over the two agents; the tainted server is
      # not a candidate, so it must not count as an empty domain either.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          matchLabelKeys:
            - rollouts-pod-template-hash
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: mttr-app
      containers:
        - name: app
          image: mttr.local/mttr-app:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: RELEASE
              value: v1
            - name: BACKEND_URL
              value: http://mttr-backend.mttr-backend.svc.cluster.local/
            # Long enough that a brief host stall is not an error, short
            # enough that an unreachable dependency fails well inside the
            # load generator's 2 s timeout.
            - name: BACKEND_TIMEOUT_MS
              value: "1000"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 2
          resources:
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              memory: 64Mi
  strategy:
    blueGreen:
      activeService: mttr-app-active
      previewService: mttr-app-preview
      autoPromotionEnabled: true
      # The preview receives only the load generator's probe stream; the gate
      # runs as long as the canary and rolling analyses (12 x 15s).
      prePromotionAnalysis:
        templates:
          - templateName: release-health-gate
            clusterScope: true
        args:
          - name: namespace
            value: mttr-bluegreen
          - name: hash
            valueFrom:
              podTemplateHashValue: Latest
